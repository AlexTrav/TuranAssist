# раздача собранного SPA и проксирование запросов к бэкенду внутри docker-сети
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router в history-режиме – на любой неизвестный путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/... уходит на контейнер бэкенда; реальный IP клиента – в X-Forwarded-For (по нему считает rate limit)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
