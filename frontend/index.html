<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TuranAssist – чат-бот с NLP для абитуриентов и студентов Университета «Туран»" />
    <title>TuranAssist – помощник абитуриента и студента</title>
    <!-- применяем тему до загрузки CSS/JS, иначе будет виден мигающий переход light -> dark -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('turanassist-theme')
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
