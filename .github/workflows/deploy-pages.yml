# собирает фронтенд и публикует его на GitHub Pages при каждом push в main, который затрагивает фронтенд
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # бэкенд на Render (бесплатный тариф засыпает – фронтенд показывает баннер «сервер просыпается»)
  VITE_API_BASE_URL: https://turanassist-backend.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # та же стадия сборки, что и в frontend/Dockerfile: vue-tsc + Vite с базовым путём project site
      - name: Build static site in Docker
        run: |
          docker build --target build \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg BASE="/${{ github.event.repository.name }}/" \
            -t turanassist-pages frontend
          docker create --name pages turanassist-pages
          docker cp pages:/app/dist ./dist

      # GitHub Pages не умеет server-side rewrite для SPA – отдаём index.html и на 404
      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
