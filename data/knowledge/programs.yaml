# образовательные программы для извлечения из вопроса: «Сколько стоит ВТиПО?» -> цена именно этой программы.
# name.ru – название строки в таблице на странице «Стоимость обучения» (по нему ищется цена),
# table_names – другие написания той же программы в таблице (например, в магистратуре).
# aliases – основы слов: слово из 4+ букв совпадает по началу («психолог» -> «психологии»),
# короткое (до 3 букв: «ис», «рэт», «pr») – только целиком; несколько слов идут подряд.
# при пересечении побеждает самое длинное совпадение: «международное право» – не «право».
programs:
