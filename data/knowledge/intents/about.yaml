# об университете: общие сведения, факультеты, контакты, адреса, международные экзамены
group: about
intents:
  - id: about_university
    title: {ru: Об университете, kk: Университет туралы, en: About the university}
    sources: [about, accreditation]
    answer:
      ru: |
        Университет «Туран» основан в 1992 году в Алматы и является ядром образовательной корпорации «Туран» (колледжи, лицей, «Туран-Астана»).
        Уровни обучения: бакалавриат, магистратура, докторантура PhD, MBA и DBA. Работают диссертационные советы по защите PhD.
        Университет прошёл международную институциональную аккредитацию агентств ACQUIN и НААР, система менеджмента качества соответствует ISO 9001:2015.
        Студенты учатся по государственным грантам и грантам университета.
      kk: |
        «Тұран» университеті 1992 жылы Алматыда құрылған және «Тұран» білім беру корпорациясының (колледждер, лицей, «Тұран-Астана») өзегі болып табылады.
        Оқу деңгейлері: бакалавриат, магистратура, PhD докторантурасы, MBA және DBA. PhD қорғау жөніндегі диссертациялық кеңестер жұмыс істейді.
        Университет ACQUIN және ТАРА агенттіктерінің халықаралық институционалдық аккредиттеуінен өтті, сапа менеджменті жүйесі ISO 9001:2015 талаптарына сәйкес келеді.
        Студенттер мемлекеттік гранттар мен университет гранттары бойынша оқиды.
      en: |
        Turan University was founded in 1992 in Almaty and is the core of the Turan educational corporation (colleges, a lyceum, Turan-Astana).
        Levels of study: bachelor's, master's, PhD, MBA and DBA. The university has dissertation councils for PhD defenses.
        It holds international institutional accreditation from ACQUIN and IAAR, and its quality management system complies with ISO 9001:2015.
        Students study on state grants and university grants.

  - id: faculties
    title: {ru: Факультеты, kk: Факультеттер, en: Faculties}
    sources: [faculty-humanities-law, faculty-economics, faculty-digital-arts, faculty-business]
    answer:
      ru: |
        Факультеты университета:
        - гуманитарно-юридический – право, социальные науки, журналистика, переводческое дело, сфера обслуживания (деканат – каб. 613);
        - экономический – бизнес и управление, логистика, часть ИКТ-программ (деканат – каб. 311);
        - «Цифровые технологии и искусство» – ИКТ, телекоммуникации, кино и театральное искусство (пр. Достык, 108/110);
        - делового администрирования – MBA, Executive MBA и DBA.
        Также работает центр довузовской подготовки Foundation.
      kk: |
        Университет факультеттері:
        - гуманитарлық-заң – құқық, әлеуметтік ғылымдар, журналистика, аударма ісі, қызмет көрсету саласы (деканат – 613 каб.);
        - экономикалық – бизнес және басқару, логистика, АКТ бағдарламаларының бір бөлігі (деканат – 311 каб.);
        - «Сандық технологиялар және өнер» – АКТ, телекоммуникациялар, кино және театр өнері (Достық даңғылы, 108/110);
        - іскерлік әкімшілік – MBA, Executive MBA және DBA.
        Сондай-ақ Foundation жоғары оқу орнына дейінгі дайындық орталығы жұмыс істейді.
      en: |
        University faculties:
        - Humanities and Law – law, social sciences, journalism, translation studies, services (dean's office – room 613);
        - Economics – business and management, logistics and some ICT programs (dean's office – room 311);
        - Digital Technologies and Arts – ICT, telecommunications, film and theater arts (108/110 Dostyk Ave.);
        - Business Administration – MBA, Executive MBA and DBA.
        There is also the Foundation pre-university training center.

