  - id: international_exams
    title: {ru: IELTS, TOEFL и SAT в университете, kk: Университеттегі IELTS, TOEFL және SAT, en: IELTS, TOEFL and SAT at the university}
    sources: [international-exams]
    answer:
      ru: |
        Университет «Туран» – официальный центр сразу трёх международных экзаменов: IELTS (авторизованный регистрационный центр British Council), TOEFL iBT и SAT.
        Регистрация – на сайтах организаторов:
        - SAT: https://collegereadiness.collegeboard.org/sat/register
        - TOEFL iBT: https://www.ets.org/toefl/test-takers/ibt/take/register/
        - IELTS – через British Council.
        По вопросам экзаменов обращайтесь к координатору тестового центра – контакты на странице «Международные экзамены».
      kk: |
        «Тұран» университеті бірден үш халықаралық емтиханның ресми орталығы: IELTS (British Council авторландырылған тіркеу орталығы), TOEFL iBT және SAT.
        Тіркелу – ұйымдастырушылардың сайттарында:
        - SAT: https://collegereadiness.collegeboard.org/sat/register
        - TOEFL iBT: https://www.ets.org/toefl/test-takers/ibt/take/register/
        - IELTS – British Council арқылы.
        Емтихандар бойынша тестілеу орталығының үйлестірушісіне жүгініңіз – байланыстар «Халықаралық емтихандар» бетінде.
      en: |
        Turan University is an official center for three international exams: IELTS (an authorized British Council registration center), TOEFL iBT and SAT.
        Register on the organizers' websites:
        - SAT: https://collegereadiness.collegeboard.org/sat/register
        - TOEFL iBT: https://www.ets.org/toefl/test-takers/ibt/take/register/
        - IELTS – via the British Council.
        For exam questions, contact the test center coordinator – details are on the International exams page.
