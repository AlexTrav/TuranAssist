# стоимость обучения (цены 2026–2027 учебного года для первого курса) и реквизиты для оплаты
group: payment
intents:
  - id: tuition_bachelor
    title: {ru: Стоимость бакалавриата, kk: Бакалавриаттың оқу ақысы, en: Bachelor's tuition}
    sources: [tuition-fee]
    answer:
      ru: |
        Стоимость обучения в бакалавриате на 2026–2027 учебный год (первый курс, за год):
        - очная, 4 года: 1 476 600 тенге на казахском или русском отделении, 1 814 700 тенге на английском;
        - очная после школы, 3 года: 1 968 800 тенге (английское отделение – 2 419 600);
        - после колледжа, 3 года: 1 476 600 тенге (английское – 1 814 700); 2 года: 1 925 100 тенге;
        - с дистанционными технологиями: после колледжа – 738 300 тенге (3 года) или 1 193 700 тенге (2 года), после вуза – 669 300 тенге.
        По отдельным программам (например, актёрское искусство, продюсирование) цена отличается – полная таблица на странице «Стоимость обучения». Узнать о скидках можно в разделе «Гранты и скидки».
      kk: |
        2026–2027 оқу жылына бакалавриаттың оқу ақысы (бірінші курс, бір жылға):
        - күндізгі, 4 жыл: қазақ немесе орыс бөлімінде 1 476 600 теңге, ағылшын бөлімінде 1 814 700 теңге;
        - мектептен кейін күндізгі, 3 жыл: 1 968 800 теңге (ағылшын бөлімі – 2 419 600);
        - колледжден кейін, 3 жыл: 1 476 600 теңге (ағылшын бөлімі – 1 814 700); 2 жыл: 1 925 100 теңге;
        - қашықтан оқыту технологияларымен: колледжден кейін – 738 300 теңге (3 жыл) немесе 1 193 700 теңге (2 жыл), ЖОО-дан кейін – 669 300 теңге.
        Жекелеген бағдарламалар бойынша (мысалы, актерлік өнер, продюсерлік) баға өзгеше – толық кесте «Оқу ақысы» бетінде. Жеңілдіктер туралы «Гранттар мен жеңілдіктер» бөлімінен білуге болады.
      en: |
        Bachelor's tuition for the 2026–2027 academic year (first year, per year):
        - full-time, 4 years: 1,476,600 tenge in the Kazakh or Russian department, 1,814,700 tenge in the English department;
        - full-time after school, 3 years: 1,968,800 tenge (English department – 2,419,600);
        - after college, 3 years: 1,476,600 tenge (English – 1,814,700); 2 years: 1,925,100 tenge;
        - with distance technologies: after college – 738,300 tenge (3 years) or 1,193,700 tenge (2 years), after a university degree – 669,300 tenge.
        Some programs (for example acting and film production) have different prices – see the full table on the Tuition fee page. Discounts are described in the Grants and discounts section.

  - id: tuition_postgrad
    title: {ru: Стоимость магистратуры и докторантуры, kk: Магистратура мен докторантураның оқу ақысы, en: Master's and PhD tuition}
    sources: [tuition-fee, phd]
    answer:
      ru: |
        Стоимость на 2026–2027 учебный год (первый курс, за год):
        - научно-педагогическая магистратура (2 года) – 1 483 500 тенге;
        - профильная магистратура (1 год) – 1 573 200 тенге;
        - MBA (2 года) – 1 650 000 тенге на русском отделении, 2 050 000 – на английском;
        - Executive MBA (1 год) – 2 050 000 тенге на русском, 2 750 000 – на английском;
        - докторантура PhD – 2 200 000 тенге;
        - DBA – 2 050 000 тенге на русском, 2 800 000 – на английском.
      kk: |
        2026–2027 оқу жылына оқу ақысы (бірінші курс, бір жылға):
        - ғылыми-педагогикалық магистратура (2 жыл) – 1 483 500 теңге;
        - бейіндік магистратура (1 жыл) – 1 573 200 теңге;
        - MBA (2 жыл) – орыс бөлімінде 1 650 000 теңге, ағылшын бөлімінде 2 050 000;
        - Executive MBA (1 жыл) – орыс бөлімінде 2 050 000 теңге, ағылшын бөлімінде 2 750 000;
        - PhD докторантурасы – 2 200 000 теңге;
        - DBA – орыс бөлімінде 2 050 000 теңге, ағылшын бөлімінде 2 800 000.
      en: |
        Tuition for the 2026–2027 academic year (first year, per year):
        - research and teaching master's (2 years) – 1,483,500 tenge;
        - professional master's (1 year) – 1,573,200 tenge;
        - MBA (2 years) – 1,650,000 tenge in Russian, 2,050,000 in English;
        - Executive MBA (1 year) – 2,050,000 tenge in Russian, 2,750,000 in English;
        - PhD – 2,200,000 tenge;
        - DBA – 2,050,000 tenge in Russian, 2,800,000 in English.

